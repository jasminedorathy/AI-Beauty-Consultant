name: CI

on:
  push:
    branches: [main, jasmine, kalyani]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies (clean install from requirements.txt)
        run: pip install --no-cache-dir -r requirements.txt

      - name: Syntax check (all modules)
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/api/payment_routes.py
          python -m py_compile app/api/auth_routes.py
          python -m py_compile app/api/routes.py
          python -m py_compile app/api/passport_routes.py
          python -m py_compile app/api/coupon_routes.py
          python -m py_compile app/api/salon_routes.py
          python -m py_compile app/auth/jwt_handler.py
          python -m py_compile app/auth/deps.py
          python -m py_compile app/core/analysis_queue.py
          python -m py_compile app/utils/rate_limiter.py
          python -m py_compile app/utils/email_utils.py
          python -m py_compile app/utils/image_storage.py

      - name: Run pytest
        env:
          # Tests run without real external services; stubs handle everything.
          ENVIRONMENT: test
          JWT_SECRET: test-secret-key-at-least-32-characters-long
          MONGO_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: beauty_test
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies (clean install from lockfile)
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run
